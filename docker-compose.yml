name: tg-bot-news

networks:
  tg-news-net:
    driver: bridge

volumes:
  pgdata:
  n8n_data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Bound to loopback only — dev/migration convenience, not exposed on the LAN.
      - '127.0.0.1:${POSTGRES_PORT}:5432'
    networks:
      - tg-news-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  rsshub:
    image: diygod/rsshub:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory
    networks:
      - tg-news-net
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://127.0.0.1:1200/healthz']
      interval: 30s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:1.60.1
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      # Separate database from the app schema (see db/init/001-create-n8n-db.sh) —
      # n8n's own ~25 internal tables must never mix with our application tables.
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${TZ}
      # Non-secret operational config read via $env in workflow expressions
      # (see docs/workflows/*.md). TELEGRAM_BOT_TOKEN and CLAUDE_API_KEY are
      # deliberately NOT here — those live only in n8n's own encrypted
      # credential store, configured via the UI. See n8n/credential-setup.md.
      RSS_BASE_URL: ${RSS_BASE_URL}
      HELPER_API_URL: ${HELPER_API_URL}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID}
      CLAUDE_MODEL: ${CLAUDE_MODEL}
    ports:
      - '${N8N_PORT}:5678'
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      rsshub:
        condition: service_healthy
    networks:
      - tg-news-net
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:5678/healthz || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5

  helper-api:
    build:
      context: .
      dockerfile: services/helper-api/Dockerfile
    restart: unless-stopped
    environment:
      HELPER_API_PORT: ${HELPER_API_PORT}
    expose:
      - '${HELPER_API_PORT}'
    networks:
      - tg-news-net
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://127.0.0.1:${HELPER_API_PORT}/health']
      interval: 15s
      timeout: 5s
      retries: 5
